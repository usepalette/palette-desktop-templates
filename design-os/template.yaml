name: Design OS
slug: design-os
type: folder
version: 1.0.0
author: Palette
description: >-
  Your design team as a file system: principles, settled design rules, process, the design
  system, and each designer's drafts in one folder of Markdown. Your team and different
  supported agents can work from the same design guidance, decisions, and lessons.
logo: logo.png
tags: [design, design-system, ui, ux, figma, workspace]
license: MIT

requires:
  palette_desktop: ">=0.5"

notes: |
  After install, say "Set this up with me" and tell your agent whether you
  design in a design tool, in code or both, where your design system and
  product live, and where your existing design docs are. A repo is enough
  to start.
